name: PEP 8 Check

on: [push, pull_request]

jobs:
  pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pycodestyle
        run: pip install pycodestyle
      - name: Run pycodestyle
        run: pycodestyle --count --statistics .
